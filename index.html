<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plove</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05060f;
    color: #e8e8e8;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  h1 {
    font-size: 56px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, #00e5ff, #ff2ea6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { margin-top: 12px; color: #9aa0b0; font-size: 16px; }
  .links { margin-top: 40px; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .links a {
    color: #00e5ff;
    text-decoration: none;
    border: 1px solid rgba(0, 229, 255, .4);
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 15px;
    transition: .2s;
  }
  .links a:hover { background: rgba(0, 229, 255, .12); border-color: #00e5ff; }
  footer { position: fixed; bottom: 20px; color: #555; font-size: 13px; }
</style>
</head>
<body>
  <h1>Plove</h1>
  <p>个人主页</p>
  <div class="links">
    <a href="https://plove.my-place.us/">博客</a>
    <a href="https://plove898.plove523.dpdns.org">Plove</a>
    <a href="https://github.com/Ploveooo">GitHub</a>
  </div>
  <footer>plove.loc.cc</footer>
</body>
</html>
